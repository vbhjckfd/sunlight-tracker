<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunlight Tracker</title>
  </head>
  <body>
    <div id="app">
      <div id="map">
        <button id="locate-btn" type="button" title="Locate me">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="3" />
            <line x1="12" y1="2" x2="12" y2="6" />
            <line x1="12" y1="18" x2="12" y2="22" />
            <line x1="2" y1="12" x2="6" y2="12" />
            <line x1="18" y1="12" x2="22" y2="12" />
          </svg>
        </button>
        <div id="location-pin" title="Observer location (map center)">
          <svg viewBox="0 0 100 100" width="40" height="40">
            <polygon points="50,10 92,46 78,46 78,88 22,88 22,46 8,46" fill="#8a5a3b" stroke="#4a2e1c" stroke-width="3" stroke-linejoin="round" />
            <rect x="42" y="60" width="16" height="28" fill="#4a2e1c" />
            <rect x="30" y="52" width="14" height="14" fill="#bfe3f5" stroke="#4a2e1c" stroke-width="2" />
            <rect x="56" y="52" width="14" height="14" fill="#bfe3f5" stroke="#4a2e1c" stroke-width="2" />
          </svg>
        </div>
        <div id="compass-rose" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="44" height="44" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="24" cy="24" r="20" stroke-width="1.5" opacity="0.6" />
            <line x1="24" y1="6" x2="24" y2="12" stroke-width="2" />
            <line x1="24" y1="36" x2="24" y2="42" stroke-width="1.5" opacity="0.6" />
            <line x1="6" y1="24" x2="12" y2="24" stroke-width="1.5" opacity="0.6" />
            <line x1="36" y1="24" x2="42" y2="24" stroke-width="1.5" opacity="0.6" />
            <text x="24" y="17" text-anchor="middle" font-size="9" font-weight="700" stroke="none" fill="currentColor">N</text>
            <text x="24" y="35.5" text-anchor="middle" font-size="7" stroke="none" fill="currentColor" opacity="0.7">S</text>
            <text x="9.5" y="27" text-anchor="middle" font-size="7" stroke="none" fill="currentColor" opacity="0.7">W</text>
            <text x="38.5" y="27" text-anchor="middle" font-size="7" stroke="none" fill="currentColor" opacity="0.7">E</text>
          </svg>
        </div>
        <svg id="sun-beams">
          <line id="beam-0" class="sun-beam" />
          <line id="beam-1" class="sun-beam" />
          <line id="beam-2" class="sun-beam" />
          <line id="beam-3" class="sun-beam" />
        </svg>
      </div>
      <div id="controls">
        <div id="status"></div>
        <div id="buildings-spinner" title="Asking for buildings heights"></div>
        <label>
          Date
          <input type="date" id="date-picker" />
        </label>
        <label>
          Time: <span id="hour-value">12:00</span> <span id="tz-label"></span>
          <button id="play-btn" type="button" title="Play through the day">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <polygon class="play-icon" points="6,4 20,12 6,20" />
              <rect class="pause-icon" x="6" y="4" width="4" height="16" />
              <rect class="pause-icon" x="14" y="4" width="4" height="16" />
            </svg>
          </button>
          <div id="slider-wrap">
            <input type="range" id="hour-picker" min="0" max="1439" step="15" />
            <div id="solar-noon-marker" title="Solar noon (sun's highest point)"></div>
            <button id="sunrise-marker" type="button" class="time-icon-marker" title="Sunrise">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <line x1="2" y1="18" x2="22" y2="18" stroke="#f5a300" stroke-width="2" stroke-linecap="round" />
                <path d="M6 18a6 6 0 0 1 12 0" fill="#ffcc33" stroke="#f5a300" stroke-width="1.5" />
                <path d="M12 10V4M9 7l3-3 3 3" fill="none" stroke="#f5a300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
            <button id="sunset-marker" type="button" class="time-icon-marker" title="Sunset">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <line x1="2" y1="18" x2="22" y2="18" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
                <path d="M6 18a6 6 0 0 1 12 0" fill="#f97316" stroke="#b45309" stroke-width="1.5" />
                <path d="M12 4v6M9 7l3 3 3-3" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </label>
        <button id="copy-link-btn" type="button" title="Copy a link to this exact view">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path class="copy-link-icon" d="M10 14a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1" />
            <path class="copy-link-icon" d="M14 10a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1" />
            <path class="copy-link-check" d="M5 13l4 4 10-10" />
          </svg>
          <span class="copy-link-label">Copy link</span>
        </button>
        <a
          id="github-link"
          href="https://github.com/vbhjckfd/sunlight-tracker"
          target="_blank"
          rel="noopener noreferrer"
          title="View source / contact on GitHub"
        >
          <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
          <span>GitHub</span>
        </a>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
