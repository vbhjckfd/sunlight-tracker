<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunlight Tracker</title>
  </head>
  <body>
    <div id="app">
      <div id="map">
        <button id="locate-btn" type="button" title="Locate me">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="3" />
            <line x1="12" y1="2" x2="12" y2="6" />
            <line x1="12" y1="18" x2="12" y2="22" />
            <line x1="2" y1="12" x2="6" y2="12" />
            <line x1="18" y1="12" x2="22" y2="12" />
          </svg>
        </button>
        <div id="location-pin" title="Observer location (map center)">
          <svg viewBox="0 0 100 100" width="40" height="40">
            <polygon points="50,10 92,46 78,46 78,88 22,88 22,46 8,46" fill="#8a5a3b" stroke="#4a2e1c" stroke-width="3" stroke-linejoin="round" />
            <rect x="42" y="60" width="16" height="28" fill="#4a2e1c" />
            <rect x="30" y="52" width="14" height="14" fill="#bfe3f5" stroke="#4a2e1c" stroke-width="2" />
            <rect x="56" y="52" width="14" height="14" fill="#bfe3f5" stroke="#4a2e1c" stroke-width="2" />
          </svg>
        </div>
        <div id="sun-icon">
          <svg viewBox="0 0 100 100" width="64" height="64">
            <g stroke="#f5a300" stroke-width="5" stroke-linecap="round">
              <line x1="50" y1="4" x2="50" y2="16" />
              <line x1="50" y1="84" x2="50" y2="96" />
              <line x1="4" y1="50" x2="16" y2="50" />
              <line x1="84" y1="50" x2="96" y2="50" />
              <line x1="18.9" y1="18.9" x2="27.5" y2="27.5" />
              <line x1="72.5" y1="72.5" x2="81.1" y2="81.1" />
              <line x1="81.1" y1="18.9" x2="72.5" y2="27.5" />
              <line x1="27.5" y1="72.5" x2="18.9" y2="81.1" />
            </g>
            <circle cx="50" cy="50" r="22" fill="#ffcc33" stroke="#f5a300" stroke-width="2" />
            <line id="angle-horizon" x1="50" y1="50" x2="68" y2="50" stroke="#c97b00" stroke-width="1.5" stroke-dasharray="2 2" />
            <line id="angle-needle" x1="50" y1="50" x2="68" y2="50" stroke="#7a3f00" stroke-width="2.5" stroke-linecap="round" />
            <circle cx="50" cy="50" r="2.5" fill="#7a3f00" />
          </svg>
        </div>
      </div>
      <div id="controls">
        <div id="status"></div>
        <label>
          Date
          <input type="date" id="date-picker" />
        </label>
        <label>
          Time: <span id="hour-value">12:00</span>
          <div id="slider-wrap">
            <input type="range" id="hour-picker" min="0" max="1439" step="15" />
            <div id="solar-noon-marker" title="Solar noon (sun's highest point)"></div>
            <button id="sunrise-marker" type="button" class="time-icon-marker" title="Sunrise">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <line x1="2" y1="18" x2="22" y2="18" stroke="#f5a300" stroke-width="2" stroke-linecap="round" />
                <path d="M6 18a6 6 0 0 1 12 0" fill="#ffcc33" stroke="#f5a300" stroke-width="1.5" />
                <path d="M12 10V4M9 7l3-3 3 3" fill="none" stroke="#f5a300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
            <button id="sunset-marker" type="button" class="time-icon-marker" title="Sunset">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <line x1="2" y1="18" x2="22" y2="18" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
                <path d="M6 18a6 6 0 0 1 12 0" fill="#f97316" stroke="#b45309" stroke-width="1.5" />
                <path d="M12 4v6M9 7l3 3 3-3" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </label>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
